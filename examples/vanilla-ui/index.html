<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A vanilla browser example using the DevKit Forge Web Component." />
    <title>DevKit Forge · Web Component example</title>
  </head>
  <body>
    <main>
      <header>
        <a href="https://github.com/truerdp/devkit-forge">DEVKIT FORGE</a>
        <p class="eyebrow">VANILLA BROWSER EXAMPLE</p>
        <h1>Import UI, without a framework.</h1>
        <p>Choose a CSV or XLSX file, map its columns, and inspect validation results. Everything runs locally in your browser.</p>
      </header>
      <df-data-importer></df-data-importer>
      <section class="report" aria-live="polite">
        <h2>Import events</h2>
        <pre id="report">Choose a file to see parser and validation events.</pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
