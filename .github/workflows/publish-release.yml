name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to stage the current main release for npm maintainer approval
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin npm CLI for Trusted Publishing
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        run: |
          set -euo pipefail
          pnpm audit --audit-level high
          for package in import-core import-csv import-xlsx import-react import-ui; do
            node -e "const p=require('./packages/$package/package.json'); if (!p.version || p.version === '0.1.0') { console.error('Package is not versioned for release:', p.name, p.version); process.exit(1) }"
          done

      - name: Build and test packages
        run: |
          set -euo pipefail
          for package in import-core import-csv import-xlsx import-react import-ui; do
            pnpm --filter "@rowlith/$package" typecheck
            pnpm --filter "@rowlith/$package" test
            pnpm --filter "@rowlith/$package" build
          done

      - name: Verify package archives
        run: pnpm check:pack

      - name: Pack release tarballs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rowlith-release"
          for package in import-core import-csv import-xlsx import-react import-ui; do
            pnpm --dir "packages/$package" pack --pack-destination "$RUNNER_TEMP/rowlith-release"
          done

      - name: Verify release tarballs
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/rowlith-release"
          for package in import-core import-csv import-xlsx import-react import-ui; do
            version="$(node -p "require('./packages/$package/package.json').version")"
            tarball="$(find "$release_dir" -maxdepth 1 -type f -name "*$package-$version.tgz" -print -quit)"
            test -n "$tarball" || { echo "::error::Missing tarball for $package@$version"; exit 1; }
            echo "Verified $(basename "$tarball")"
          done

      - name: Stage packages in dependency order using npm Trusted Publishing
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/rowlith-release"
          publish_if_missing() {
            package_name="$1"
            package_dir="$2"
            package_slug="$3"
            version="$(node -p "require('./$package_dir/package.json').version")"
            npm_view_error="$(mktemp)"
            if npm view "$package_name@$version" version >/dev/null 2>"$npm_view_error"; then
              rm -f "$npm_view_error"
              echo "$package_name@$version is already published; skipping."
              return
            else
              npm_view_status=$?
              if ! grep -q 'E404' "$npm_view_error"; then
                cat "$npm_view_error" >&2
                rm -f "$npm_view_error"
                echo "::error::Could not verify registry status for $package_name@$version; refusing to publish."
                return "$npm_view_status"
              fi
              rm -f "$npm_view_error"
              echo "$package_name@$version is not present on npm; staging for maintainer approval."
            fi
            tarball="$(find "$release_dir" -maxdepth 1 -type f -name "*$package_slug-$version.tgz" -print -quit)"
            test -n "$tarball" || { echo "::error::Missing tarball for $package_name@$version"; exit 1; }
            stage_dir="$(mktemp -d)"
            tar -xzf "$tarball" -C "$stage_dir"
            (
              cd "$stage_dir/package"
              npm stage publish --access public
            )
            rm -rf "$stage_dir"
          }
          publish_if_missing "@rowlith/import-core" "packages/import-core" "import-core"
          publish_if_missing "@rowlith/import-csv" "packages/import-csv" "import-csv"
          publish_if_missing "@rowlith/import-xlsx" "packages/import-xlsx" "import-xlsx"
          publish_if_missing "@rowlith/import-react" "packages/import-react" "import-react"
          publish_if_missing "@rowlith/import-ui" "packages/import-ui" "import-ui"
