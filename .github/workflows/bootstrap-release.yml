name: Prepare npm release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-bootstrap-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pending Changesets
        run: pnpm changeset status

      - name: Apply release versions and changelogs
        run: pnpm changeset version

      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Test and build core
        run: |
          pnpm --filter @rowlith/import-core typecheck
          pnpm --filter @rowlith/import-core test
          pnpm --filter @rowlith/import-core build
          pnpm --filter @rowlith/import-core benchmark

      - name: Test and build CSV adapter
        run: |
          pnpm --filter @rowlith/import-csv typecheck
          pnpm --filter @rowlith/import-csv test
          pnpm --filter @rowlith/import-csv build

      - name: Test and build XLSX adapter
        run: |
          pnpm --filter @rowlith/import-xlsx typecheck
          pnpm --filter @rowlith/import-xlsx test
          pnpm --filter @rowlith/import-xlsx build

      - name: Test and build React adapter
        run: |
          pnpm --filter @rowlith/import-react typecheck
          pnpm --filter @rowlith/import-react test
          pnpm --filter @rowlith/import-react build

      - name: Test and build UI package
        run: |
          pnpm --filter @rowlith/import-ui typecheck
          pnpm --filter @rowlith/import-ui test
          pnpm --filter @rowlith/import-ui build

      - name: Verify package archives
        run: pnpm check:pack

      - name: Validate playground, examples, and docs
        run: |
          pnpm --filter @rowlith/playground typecheck
          pnpm --filter @rowlith/playground test
          pnpm --filter @rowlith/playground build
          pnpm --filter @rowlith/example-vite-react typecheck
          pnpm --filter @rowlith/example-vite-react build
          pnpm --filter @rowlith/example-vanilla-ui typecheck
          pnpm --filter @rowlith/example-vanilla-ui build
          pnpm --filter @rowlith/docs build

      - name: Install browser test engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Pack release tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/rowlith-release"
          pnpm --dir packages/import-core pack --pack-destination "$RUNNER_TEMP/rowlith-release"
          pnpm --dir packages/import-csv pack --pack-destination "$RUNNER_TEMP/rowlith-release"
          pnpm --dir packages/import-xlsx pack --pack-destination "$RUNNER_TEMP/rowlith-release"
          pnpm --dir packages/import-react pack --pack-destination "$RUNNER_TEMP/rowlith-release"
          pnpm --dir packages/import-ui pack --pack-destination "$RUNNER_TEMP/rowlith-release"

      - name: Verify release tarballs
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/rowlith-release"
          for package in import-core import-csv import-xlsx import-react import-ui; do
            version="$(node -p "require('./packages/$package/package.json').version")"
            tarball="$(find "$release_dir" -maxdepth 1 -type f -name "*$package-$version.tgz" -print -quit)"
            test -n "$tarball" || { echo "::error::Missing tarball for $package@$version"; exit 1; }
            echo "Verified $(basename "$tarball")"
          done

      - name: Commit release versions and changelogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packages .changeset pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No release metadata changes to commit."
            exit 0
          fi
          git commit -m "chore(release): publish Rowlith packages"
          git push origin HEAD:main
