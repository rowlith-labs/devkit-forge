name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck core
        run: pnpm --filter @devkit-forge/import-core typecheck
      - name: Test core
        run: pnpm --filter @devkit-forge/import-core test
      - name: Build core
        run: pnpm --filter @devkit-forge/import-core build
      - name: Typecheck CSV
        run: pnpm --filter @devkit-forge/import-csv typecheck
      - name: Test CSV
        run: pnpm --filter @devkit-forge/import-csv test
      - name: Build CSV
        run: pnpm --filter @devkit-forge/import-csv build
